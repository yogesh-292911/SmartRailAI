<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1020" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#0f0f12"/>
    </linearGradient>

    <!-- Container Gradients -->
    <linearGradient id="containerBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#18181b" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="darkNodeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2d32"/>
      <stop offset="100%" stop-color="#202024"/>
    </linearGradient>

    <linearGradient id="blueNodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="greenNodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>

    <linearGradient id="yellowNodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="purpleCylinderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.3"/>
    </filter>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <style>
    .container-title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 15px; font-weight: 600; fill: #cbd5e1; }
    .node-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #f8fafc; text-anchor: middle; dominant-baseline: central; }
    .node-text-dark { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
    .badge-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #94a3b8; text-anchor: middle; dominant-baseline: central; }
    .connector { stroke: #38bdf8; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .wire { stroke: #64748b; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="800" height="1020" fill="url(#canvasBg)"/>

  <!-- ========================================== -->
  <!-- 1. CONTAINER: MOBILE APPLICATION           -->
  <!-- ========================================== -->
  <rect x="210" y="40" width="380" height="305" rx="6" fill="url(#containerBg)" stroke="#52525b" stroke-width="1.2" filter="url(#dropShadow)"/>
  <text x="226" y="65" class="container-title">Mobile Application</text>

  <!-- QR Scanner -->
  <rect x="420" y="90" width="140" height="42" rx="4" fill="url(#darkNodeBg)" stroke="#64748b" stroke-width="1.2"/>
  <text x="490" y="111" class="node-text">QR Scanner</text>

  <!-- Inspector UI -->
  <rect x="420" y="190" width="140" height="42" rx="4" fill="url(#darkNodeBg)" stroke="#64748b" stroke-width="1.2"/>
  <text x="490" y="211" class="node-text">Inspector UI</text>

  <!-- Maintenance UI -->
  <rect x="230" y="190" width="160" height="42" rx="4" fill="url(#darkNodeBg)" stroke="#64748b" stroke-width="1.2"/>
  <text x="310" y="211" class="node-text">Maintenance UI</text>

  <!-- Connector: QR Scanner -> Inspector UI -->
  <path d="M 490 132 L 490 188" class="connector" marker-end="url(#arrow)"/>

  <!-- Connectors: Maintenance UI & Inspector UI -> Flutter Android App -->
  <path d="M 310 232 L 310 260 L 400 260 L 400 282" class="connector" marker-end="url(#arrow)"/>
  <path d="M 490 232 L 490 260 L 400 260" class="connector"/>

  <!-- Flutter Android App -->
  <rect x="305" y="284" width="190" height="44" rx="4" fill="url(#blueNodeGrad)" stroke="#e0f2fe" stroke-width="1.5" filter="url(#glowBlue)"/>
  <text x="400" y="306" class="node-text" font-weight="700">Flutter Android App</text>


  <!-- ========================================== -->
  <!-- CONNECTOR BADGE: HTTP/REST                 -->
  <!-- ========================================== -->
  <path d="M 400 328 L 400 405" class="wire"/>
  <rect x="350" y="395" width="100" height="34" rx="4" fill="#27272a" stroke="#475569" stroke-width="1"/>
  <text x="400" y="412" class="badge-text">HTTP/REST</text>
  <path d="M 400 429 L 400 528" class="connector" marker-end="url(#arrow)"/>


  <!-- ========================================== -->
  <!-- 2. CONTAINER: BACKEND SERVER               -->
  <!-- ========================================== -->
  <rect x="295" y="490" width="490" height="205" rx="6" fill="url(#containerBg)" stroke="#52525b" stroke-width="1.2" filter="url(#dropShadow)"/>
  <text x="310" y="515" class="container-title">Backend Server</text>

  <!-- Flask REST API -->
  <rect x="315" y="530" width="170" height="46" rx="4" fill="url(#greenNodeGrad)" stroke="#dcfce7" stroke-width="1.5"/>
  <text x="400" y="553" class="node-text" font-weight="700">Flask REST API</text>

  <!-- Flask branch out wires -->
  <!-- Wire down to Authentication & Asset Manager -->
  <path d="M 400 576 L 400 610" class="connector"/>
  <path d="M 400 610 L 475 610 L 475 632" class="connector" marker-end="url(#arrow)"/>
  <path d="M 475 610 L 690 610 L 690 632" class="connector" marker-end="url(#arrow)"/>

  <!-- Authentication -->
  <rect x="390" y="634" width="150" height="42" rx="4" fill="url(#darkNodeBg)" stroke="#64748b" stroke-width="1.2"/>
  <text x="465" y="655" class="node-text">Authentication</text>

  <!-- Asset & Alert Manager -->
  <rect x="560" y="634" width="210" height="42" rx="4" fill="url(#darkNodeBg)" stroke="#64748b" stroke-width="1.2"/>
  <text x="665" y="655" class="node-text">Asset &amp; Alert Manager</text>

  <!-- Trunk wire to AI and DB -->
  <path d="M 400 576 L 155 576 L 155 812" class="connector" marker-end="url(#arrow)"/>
  <path d="M 530 610 L 530 812" class="connector" marker-end="url(#arrow)"/>


  <!-- ========================================== -->
  <!-- 3. CONTAINER: ARTIFICIAL INTELLIGENCE      -->
  <!-- ========================================== -->
  <rect x="20" y="750" width="270" height="220" rx="6" fill="url(#containerBg)" stroke="#52525b" stroke-width="1.2" filter="url(#dropShadow)"/>
  <text x="35" y="775" class="container-title">Artificial Intelligence</text>

  <!-- Random Forest Classifier -->
  <rect x="35" y="814" width="240" height="46" rx="4" fill="url(#yellowNodeGrad)" stroke="#fef3c7" stroke-width="1.5"/>
  <text x="155" y="837" class="node-text-dark">Random Forest Classifier</text>

  <!-- AI Wire to Risk Prediction Engine -->
  <path d="M 155 860 L 155 918" class="connector" marker-end="url(#arrow)"/>

  <!-- Risk Prediction Engine -->
  <rect x="45" y="920" width="220" height="42" rx="4" fill="url(#darkNodeBg)" stroke="#64748b" stroke-width="1.2"/>
  <text x="155" y="941" class="node-text">Risk Prediction Engine</text>


  <!-- ========================================== -->
  <!-- 4. CONTAINER: DATABASE                     -->
  <!-- ========================================== -->
  <rect x="325" y="750" width="460" height="220" rx="6" fill="url(#containerBg)" stroke="#52525b" stroke-width="1.2" filter="url(#dropShadow)"/>
  <text x="340" y="775" class="container-title">Database</text>

  <!-- MySQL Cylinder Shape -->
  <g transform="translate(440, 814)">
    <!-- Cylinder Body -->
    <path d="M 0 16 L 0 40 A 90 14 0 0 0 180 40 L 180 16 Z" fill="url(#purpleCylinderGrad)" stroke="#f3e8ff" stroke-width="1.2"/>
    <!-- Cylinder Top Ellipse -->
    <ellipse cx="90" cy="16" rx="90" ry="14" fill="#c084fc" stroke="#f3e8ff" stroke-width="1.2"/>
    <!-- Cylinder Bottom Rim Highlight -->
    <path d="M 0 40 A 90 14 0 0 0 180 40" fill="none" stroke="#f3e8ff" stroke-width="1.2"/>
    <!-- Text -->
    <text x="90" y="32" class="node-text" font-weight="700">MySQL Database</text>
  </g>

  <!-- DB Wire to Users & Assets and Inspection History -->
  <path d="M 530 870 L 530 900" class="connector"/>
  <path d="M 530 900 L 425 900 L 425 918" class="connector" marker-end="url(#arrow)"/>
  <path d="M 530 900 L 675 900 L 675 918" class="connector" marker-end="url(#arrow)"/>

  <!-- Users & Assets -->
  <rect x="345" y="920" width="160" height="42" rx="4" fill="url(#darkNodeBg)" stroke="#64748b" stroke-width="1.2"/>
  <text x="425" y="941" class="node-text">Users &amp; Assets</text>

  <!-- Inspection History -->
  <rect x="585" y="920" width="180" height="42" rx="4" fill="url(#darkNodeBg)" stroke="#64748b" stroke-width="1.2"/>
  <text x="675" y="941" class="node-text">Inspection History</text>
</svg>
