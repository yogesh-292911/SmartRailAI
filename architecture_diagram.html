<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartRail System Architecture Diagram</title>
  <style>
    body {
      margin: 0;
      padding: 30px;
      background-color: #121214;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #f1f5f9;
    }
    .toolbar {
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #1d4ed8;
    }
    .diagram-card {
      background: #18181b;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      padding: 24px;
      max-width: 860px;
      width: 100%;
      border: 1px solid #27272a;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button onclick="downloadSvg()">Download SVG (For PPT / Word)</button>
    <button onclick="exportPng()">Download High-Res PNG (3000px)</button>
  </div>
  <div class="diagram-card" id="svgContainer">
    <!-- Inline SVG content -->
    <iframe src="architecture_diagram.svg" width="100%" height="1040px" style="border:none;"></iframe>
  </div>

  <script>
    function downloadSvg() {
      const a = document.createElement('a');
      a.href = 'architecture_diagram.svg';
      a.download = 'SmartRail_Architecture_Diagram.svg';
      a.click();
    }

    function exportPng() {
      fetch('architecture_diagram.svg')
        .then(res => res.text())
        .then(svgText => {
          const img = new Image();
          const svgBlob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
          const url = URL.createObjectURL(svgBlob);
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const scale = 3;
            canvas.width = 800 * scale;
            canvas.height = 1020 * scale;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            URL.revokeObjectURL(url);
            const pngUrl = canvas.toDataURL('image/png');
            const a = document.createElement('a');
            a.download = 'SmartRail_Architecture_Diagram_HD.png';
            a.href = pngUrl;
            a.click();
          };
          img.src = url;
        });
    }
  </script>
</body>
</html>
